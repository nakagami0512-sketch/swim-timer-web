
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071b35">
<title>Swim Timer</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#071b35;
  color:white;
  font-family:Arial,sans-serif;
  padding:16px;
}

h1{text-align:center;color:#55d6ff}

.card{
  background:#122b49;
  padding:16px;
  border-radius:14px;
  margin:14px 0;
}

button{
  background:#168bd0;
  color:white;
  border:0;
  border-radius:9px;
  padding:12px;
  margin:4px;
  font-size:15px;
}

button:disabled{opacity:.5}

video{
  display:block;
  width:100%;
  background:#000;
  border-radius:10px;
}

.video-wrap{
  position:relative;
  width:100%;
}

#overlay{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

.time{
  font-size:25px;
  color:#55d6ff;
  font-weight:bold;
}

.small{
  font-size:13px;
  color:#b8cce0;
}

.row{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

#frames{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.frame{
  background:#071b35;
  padding:6px;
  border-radius:8px;
}

.frame img{
  width:100%;
  border-radius:5px;
}

#playerResults button{
  display:block;
  width:100%;
  text-align:left;
}

#aiStatus{
  line-height:1.6;
}

</style>
</head>

<body>

<h1>SWIM TIMER</h1>

<div class="card">
<h3>① 動画を選択</h3>
<input id="file" type="file" accept="video/*">
<p id="fileStatus" class="small">動画を選択してください。</p>
</div>

<div class="card">
<h3>② 動画を確認</h3>

<div class="video-wrap">
  <video id="video" controls playsinline preload="auto"></video>
  <canvas id="overlay"></canvas>
</div>

<div class="row">
<button id="backFrame">◀ 1コマ戻る</button>
<button id="nextFrame">1コマ進む ▶</button>
</div>

<p>
現在時刻：
<span id="current" class="time">0.000</span> 秒
</p>
</div>

<div class="card">
<h3>③ スタート・タッチを記録</h3>

<button id="markStart">スタートを記録</button>
<button id="markFinish">タッチを記録</button>

<p>スタート：<span id="start">未設定</span></p>
<p>タッチ：<span id="finish">未設定</span></p>

<button id="calculate">タイムを計算</button>
<p class="time" id="result">--.---</p>
</div>

<div class="card">
<h3>④ 動画から画像を取り出す</h3>

<p class="small">
0.5秒ごとの画像を最大80枚、端末内で取り出します。
</p>

<button id="extract">画像を取り出す</button>

<p id="status" class="small">動画を選択してください。</p>
<div id="frames"></div>
</div>

<div class="card">
<h3>⑤ AI選手検出・追跡</h3>

<p id="aiStatus" class="small">
AIモデルの準備ができていません。
</p>

<div class="row">
<button id="loadAI">AIモデルを読み込む</button>
<button id="detectPlayers" disabled>選手を検出する</button>
</div>

<p class="small">
動画を一時停止して選手を検出し、対象を選んでください。
再生すると追跡を開始します。
見失った場合は再検出候補を表示します。
</p>

<div id="playerResults"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

<script>

// ==================================
// 基本設定
// ==================================

const video = document.getElementById('video');
const fileInput = document.getElementById('file');
const overlay = document.getElementById('overlay');
const ctx = overlay.getContext('2d');

const frames = document.getElementById('frames');

const aiStatus = document.getElementById('aiStatus');
const loadAIButton = document.getElementById('loadAI');
const detectButton = document.getElementById('detectPlayers');
const playerResults = document.getElementById('playerResults');

const status = document.getElementById('status');

let videoUrl = null;
let frameRate = 30;

let startTime = null;
let finishTime = null;

let aiModel = null;

// 現在追跡している選手
let selectedPlayer = null;

// 選手の位置
let previousCenter = null;

// 選手の見た目の特徴
let selectedAppearance = null;

// 追跡状態
let trackingActive = false;
let trackingTimer = null;
let detecting = false;
let lostCount = 0;

// 現在検出している人物
let lastPredictions = [];

// 再検出候補
let reacquireCandidates = [];

// 見た目比較用キャンバス
const appearanceCanvas = document.createElement('canvas');
appearanceCanvas.width = 24;
appearanceCanvas.height = 24;

const appearanceCtx = appearanceCanvas.getContext('2d');


// ==================================
// 動画読み込み
// ==================================

fileInput.addEventListener('change', event => {

  const file = event.target.files[0];

  if (!file) return;

  stopTracking();

  if (videoUrl) {
    URL.revokeObjectURL(videoUrl);
  }

  videoUrl = URL.createObjectURL(file);

  video.src = videoUrl;
  video.load();

  startTime = null;
  finishTime = null;

  selectedPlayer = null;
  previousCenter = null;
  selectedAppearance = null;

  lostCount = 0;
  lastPredictions = [];
  reacquireCandidates = [];

  playerResults.innerHTML = '';

  clearOverlay();

  document.getElementById('start').textContent = '未設定';
  document.getElementById('finish').textContent = '未設定';
  document.getElementById('result').textContent = '--.---';

  document.getElementById('fileStatus').textContent =
    '動画を読み込んでいます...';

  status.textContent = '動画を読み込んでいます...';

  video.addEventListener('loadedmetadata', () => {

    document.getElementById('fileStatus').textContent =
      '動画を読み込みました。';

    status.textContent = '動画を読み込みました。';

    updateTime();
    resizeOverlay();

  }, {once:true});

  video.addEventListener('error', () => {

    document.getElementById('fileStatus').textContent =
      '動画の読み込みに失敗しました。';

  }, {once:true});

});


// ==================================
// 時刻表示・コマ送り
// ==================================

function updateTime(){

  document.getElementById('current').textContent =
    video.currentTime.toFixed(3);

}

video.addEventListener('timeupdate', updateTime);
video.addEventListener('seeked', updateTime);

document.getElementById('backFrame').addEventListener('click', () => {
  step(-1);
});

document.getElementById('nextFrame').addEventListener('click', () => {
  step(1);
});

function step(direction){

  if (!video.src) return;

  video.pause();

  video.currentTime = Math.max(
    0,
    Math.min(
      video.duration || 0,
      video.currentTime + direction / frameRate
    )
  );

}


// ==================================
// 手動タイム計測
// ==================================

document.getElementById('markStart').addEventListener('click', () => {
  mark('start');
});

document.getElementById('markFinish').addEventListener('click', () => {
  mark('finish');
});

function mark(type){

  if (!video.src) {
    alert('先に動画を選んでください');
    return;
  }

  if (type === 'start') {

    startTime = video.currentTime;

    document.getElementById('start').textContent =
      startTime.toFixed(3) + ' 秒';

  } else {

    finishTime = video.currentTime;

    document.getElementById('finish').textContent =
      finishTime.toFixed(3) + ' 秒';

  }

}

document.getElementById('calculate').addEventListener('click', calculate);

function calculate(){

  if (startTime === null || finishTime === null) {
    alert('スタートとタッチの両方を記録してください');
    return;
  }

  const result = finishTime - startTime;

  if (result < 0) {
    alert('時刻を確認してください');
    return;
  }

  document.getElementById('result').textContent =
    result.toFixed(3) + ' 秒';

}


// ==================================
// 動画移動
// ==================================

function seekTo(time){

  return new Promise((resolve, reject) => {

    const target = Math.max(
      0,
      Math.min(time, Math.max(0, video.duration - 0.01))
    );

    if (
      !video.seeking &&
      Math.abs(video.currentTime - target) < 0.015
    ) {
      setTimeout(resolve, 100);
      return;
    }

    let finished = false;

    const cleanup = () => {
      clearTimeout(timer);
      video.removeEventListener('seeked', onSeeked);
      video.removeEventListener('error', onError);
    };

    const done = () => {
      if (finished) return;
      finished = true;
      cleanup();
      resolve();
    };

    const fail = () => {
      if (finished) return;
      finished = true;
      cleanup();
      reject(new Error('動画の移動がタイムアウトしました'));
    };

    const onSeeked = () => {
      setTimeout(() => {
        if (video.readyState >= 2) done();
        else fail();
      }, 120);
    };

    const onError = () => fail();

    const timer = setTimeout(fail, 10000);

    video.addEventListener('seeked', onSeeked);
    video.addEventListener('error', onError);

    try {
      video.currentTime = target;
    } catch (error) {
      fail();
    }

  });

}


async function waitForVideoFrame(){

  if (video.readyState < 2) {

    await new Promise((resolve, reject) => {

      const timer = setTimeout(() => {
        cleanup();
        reject(new Error('動画の読み込み待ちがタイムアウトしました'));
      }, 5000);

      const onReady = () => {
        cleanup();
        resolve();
      };

      const onError = () => {
        cleanup();
        reject(new Error('動画を読み込めません'));
      };

      const cleanup = () => {
        clearTimeout(timer);
        video.removeEventListener('loadeddata', onReady);
        video.removeEventListener('error', onError);
      };

      video.addEventListener('loadeddata', onReady, {once:true});
      video.addEventListener('error', onError, {once:true});

    });

  }

  if (video.videoWidth === 0 || video.videoHeight === 0) {
    throw new Error('動画の画像サイズを取得できません');
  }

}


// ==================================
// 画像抽出
// ==================================

document.getElementById('extract').addEventListener('click', extractFrames);

async function extractFrames(){

  if (
    !video.src ||
    !Number.isFinite(video.duration) ||
    video.duration <= 0
  ) {
    alert('先に動画を選んでください');
    return;
  }

  const extractButton = document.getElementById('extract');

  extractButton.disabled = true;
  video.pause();
  frames.innerHTML = '';

  const canvas = document.createElement('canvas');
  const imageContext = canvas.getContext('2d');

  canvas.width = 320;

  canvas.height = Math.max(
    1,
    Math.round(320 * video.videoHeight / video.videoWidth)
  );

  const interval = 0.5;

  const count = Math.min(
    Math.ceil(video.duration / interval),
    80
  );

  const oldTime = video.currentTime;

  let successCount = 0;

  try {

    await waitForVideoFrame();

    for (let i = 0; i < count; i++) {

      const t = Math.min(
        i * interval,
        Math.max(0, video.duration - 0.05)
      );

      status.textContent =
        '画像を取り出しています：' + (i + 1) + ' / ' + count;

      await seekTo(t);
      await waitForVideoFrame();

      imageContext.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      const img = document.createElement('img');

      img.src = canvas.toDataURL('image/jpeg', 0.65);

      const item = document.createElement('div');
      item.className = 'frame';

      const label = document.createElement('div');
      label.textContent = t.toFixed(1) + ' 秒';
      label.className = 'small';

      item.appendChild(img);
      item.appendChild(label);

      item.addEventListener('click', () => {
        video.currentTime = t;
        video.pause();
      });

      frames.appendChild(item);

      successCount++;

    }

    status.textContent =
      successCount + '枚の画像を取り出しました。';

  } catch (error) {

    status.textContent =
      '画像抽出エラー：' + error.message;

  } finally {

    try {
      await seekTo(oldTime);
    } catch (error) {}

    extractButton.disabled = false;

  }

}


// ==================================
// AIモデル読み込み
// ==================================

loadAIButton.addEventListener('click', async () => {

  if (aiModel) {
    aiStatus.textContent = 'AIモデルは読み込み済みです。';
    return;
  }

  try {

    loadAIButton.disabled = true;

    aiStatus.textContent =
      'AIモデルを読み込んでいます...';

    await tf.ready();

    aiModel = await cocoSsd.load({
      base: 'lite_mobilenet_v2'
    });

    aiStatus.textContent =
      'AIモデルの準備ができました！';

    detectButton.disabled = false;

  } catch (error) {

    aiStatus.textContent =
      '読み込みエラー：' + error.message;

    loadAIButton.disabled = false;

  }

});


// ==================================
// 枠の表示
// ==================================

function resizeOverlay(){

  if (!video.videoWidth) return;

  overlay.width = video.videoWidth;
  overlay.height = video.videoHeight;

  drawBoxes(lastPredictions);

}

function clearOverlay(){

  ctx.clearRect(0, 0, overlay.width, overlay.height);

}

function drawBoxes(predictions){

  if (!video.videoWidth) return;

  if (
    overlay.width !== video.videoWidth ||
    overlay.height !== video.videoHeight
  ) {
    overlay.width = video.videoWidth;
    overlay.height = video.videoHeight;
  }

  clearOverlay();

  predictions.forEach(player => {

    const b = player.bbox;

    const isSelected = player.isSelected === true;

    ctx.lineWidth = Math.max(3, video.videoWidth / 250);

    ctx.strokeStyle = isSelected ? '#00ff80' : '#55d6ff';

    ctx.strokeRect(b[0], b[1], b[2], b[3]);

    ctx.font = 'bold 24px Arial';

    ctx.fillStyle = isSelected ? '#00ff80' : '#55d6ff';

    ctx.fillText(
      isSelected ? 'TARGET' : 'PERSON',
      b[0],
      Math.max(25, b[1] - 8)
    );

  });

}

video.addEventListener('loadedmetadata', resizeOverlay);
window.addEventListener('resize', resizeOverlay);


// ==================================
// 選手の見た目を記録・比較
// ==================================

function getAppearanceDescriptor(bbox){

  try {

    const [x, y, w, h] = bbox;

    const cropX = Math.max(0, x + w * 0.2);
    const cropY = Math.max(0, y + h * 0.15);

    const cropW = Math.min(
      w * 0.6,
      video.videoWidth - cropX
    );

    const cropH = Math.min(
      h * 0.7,
      video.videoHeight - cropY
    );

    if (cropW <= 0 || cropH <= 0) return null;

    appearanceCtx.clearRect(0, 0, 24, 24);

    appearanceCtx.drawImage(
      video,
      cropX, cropY, cropW, cropH,
      0, 0, 24, 24
    );

    const pixels = appearanceCtx.getImageData(
      0, 0, 24, 24
    ).data;

    const histogram = new Array(64).fill(0);

    for (let i = 0; i < pixels.length; i += 4) {

      const r = Math.floor(pixels[i] / 64);
      const g = Math.floor(pixels[i + 1] / 64);
      const b = Math.floor(pixels[i + 2] / 64);

      const index = r * 16 + g * 4 + b;

      histogram[index]++;

    }

    const total = histogram.reduce((a, b) => a + b, 0);

    return histogram.map(value => value / total);

  } catch (error) {

    return null;

  }

}


function compareAppearance(a, b){

  if (!a || !b) return 0;

  let similarity = 0;

  for (let i = 0; i < a.length; i++) {
    similarity += Math.min(a[i], b[i]);
  }

  return similarity;

}


// ==================================
// 選手検出
// ==================================

detectButton.addEventListener('click', detectPlayers);

async function detectPlayers(){

  if (!aiModel || !video.videoWidth) {
    aiStatus.textContent =
      '動画とAIモデルを準備してください。';
    return;
  }

  if (detecting) return;

  try {

    video.pause();

    detecting = true;
    detectButton.disabled = true;

    aiStatus.textContent = '選手を検出しています...';

    await waitForVideoFrame();

    const predictions = await aiModel.detect(video);

    const players = predictions.filter(
      p => p.class === 'person' && p.score >= 0.20
    );

    lastPredictions = players;

    selectedPlayer = null;
    previousCenter = null;
    selectedAppearance = null;
    lostCount = 0;

    playerResults.innerHTML = '';

    if (players.length === 0) {

      aiStatus.textContent =
        '選手を検出できませんでした。別の場面で試してください。';

      drawBoxes([]);

      return;

    }

    players.forEach((player, index) => {

      const button = document.createElement('button');

      button.textContent =
        '選手 ' + (index + 1) +
        '（検出信頼度 ' +
        Math.round(player.score * 100) + '%）';

      button.addEventListener('click', () => {

        stopTracking();

        lastPredictions.forEach(p => {
          p.isSelected = false;
        });

        selectedPlayer = player;

        previousCenter = {
          x: player.bbox[0] + player.bbox[2] / 2,
          y: player.bbox[1] + player.bbox[3] / 2
        };

        selectedAppearance =
          getAppearanceDescriptor(player.bbox);

        lostCount = 0;

        player.isSelected = true;

        playerResults.querySelectorAll('button').forEach(b => {
          b.style.background = '#168bd0';
        });

        button.style.background = '#159957';

        drawBoxes(lastPredictions);

        aiStatus.textContent =
          '選手 ' + (index + 1) +
          ' を選択しました。動画を再生すると追跡します。';

      });

      playerResults.appendChild(button);

    });

    drawBoxes(players);

    aiStatus.textContent =
      players.length + '人の候補を検出しました。対象選手を選んでください。';

  } catch (error) {

    aiStatus.textContent =
      '検出エラー：' + error.message;

  } finally {

    detecting = false;
    detectButton.disabled = !aiModel;

  }

}


// ==================================
// 再検出候補の表示
// ==================================

function showReacquireCandidates(candidates){

  playerResults.innerHTML = '';

  const heading = document.createElement('p');
  heading.className = 'small';
  heading.textContent =
    '同じ選手か自動判定できません。正しい選手を選んでください。';

  playerResults.appendChild(heading);

  candidates.slice(0, 4).forEach((candidate, index) => {

    const button = document.createElement('button');

    button.textContent =
      '再検出候補 ' + (index + 1) +
      '（見た目の類似度 ' +
      Math.round(candidate.similarity * 100) + '%）';

    button.addEventListener('click', () => {

      lastPredictions.forEach(p => {
        p.isSelected = false;
      });

      selectedPlayer = candidate.player;

      previousCenter = {
        x: candidate.x,
        y: candidate.y
      };

      selectedAppearance = candidate.appearance;

      lostCount = 0;

      candidate.player.isSelected = true;

      drawBoxes(lastPredictions);

      playerResults.innerHTML = '';

      aiStatus.textContent =
        '選手を再選択しました。追跡を続けます。';

    });

    playerResults.appendChild(button);

  });

}


// ==================================
// 選手追跡
// ==================================

async function trackSelectedPlayer(){

  if (
    !trackingActive ||
    !aiModel ||
    video.paused ||
    detecting
  ) {
    return;
  }

  detecting = true;

  try {

    const predictions = await aiModel.detect(video);

    const players = predictions.filter(
      p => p.class === 'person' && p.score >= 0.20
    );

    const diagonal = Math.hypot(
      video.videoWidth,
      video.videoHeight
    );

    const candidates = players.map(player => {

      const x = player.bbox[0] + player.bbox[2] / 2;
      const y = player.bbox[1] + player.bbox[3] / 2;

      const distance = previousCenter
        ? Math.hypot(
            x - previousCenter.x,
            y - previousCenter.y
          )
        : Infinity;

      const appearance = getAppearanceDescriptor(player.bbox);

      const similarity = compareAppearance(
        selectedAppearance,
        appearance
      );

      return {
        player,
        x,
        y,
        distance,
        similarity,
        appearance
      };

    });

    candidates.sort((a, b) => b.similarity - a.similarity);

    let target = null;

    // 通常追跡：位置と見た目を合わせて判断
    if (lostCount === 0) {

      const nearby = candidates.filter(
        c => c.distance < diagonal * 0.30
      );

      if (nearby.length > 0) {

        nearby.sort((a, b) => {

          const scoreA =
            a.similarity * 0.65 +
            (1 - a.distance / diagonal) * 0.35;

          const scoreB =
            b.similarity * 0.65 +
            (1 - b.distance / diagonal) * 0.35;

          return scoreB - scoreA;

        });

        target = nearby[0].player;

      }

    }

    // 見失った後：見た目を優先して再検出
    if (!target && candidates.length > 0) {

      const best = candidates[0];
      const second = candidates[1];

      const clearlyBetter =
        !second ||
        best.similarity - second.similarity >= 0.12;

      if (
        best.similarity >= 0.55 &&
        clearlyBetter
      ) {

        target = best.player;

      } else {

        reacquireCandidates = candidates;

        showReacquireCandidates(candidates);

      }

    }

    if (target) {

      lastPredictions.forEach(p => {
        p.isSelected = false;
      });

      selectedPlayer = target;

      previousCenter = {
        x: target.bbox[0] + target.bbox[2] / 2,
        y: target.bbox[1] + target.bbox[3] / 2
      };

      target.isSelected = true;

      lastPredictions = players;

      lostCount = 0;

      playerResults.innerHTML = '';

      drawBoxes(players);

      aiStatus.textContent =
        '追跡中：選手を検出しています。';

    } else {

      lostCount++;

      lastPredictions = players;

      drawBoxes(players);

      if (players.length === 0) {

        aiStatus.textContent =
          '選手を見失っています。画面に戻るのを待っています。';

      } else {

        aiStatus.textContent =
          '同じ選手か判断できません。候補から選んでください。';

      }

    }

  } catch (error) {

    aiStatus.textContent =
      '追跡エラー：' + error.message;

  } finally {

    detecting = false;

    if (trackingActive && !video.paused) {
      trackingTimer = setTimeout(trackSelectedPlayer, 700);
    }

  }

}


// ==================================
// 再生・停止との連動
// ==================================

video.addEventListener('play', () => {

  if (!aiModel || !selectedPlayer) {
    aiStatus.textContent =
      'AIモデルを読み込み、選手を選択してください。';
    return;
  }

  trackingActive = true;

  aiStatus.textContent = '追跡を開始します...';

  trackSelectedPlayer();

});

video.addEventListener('pause', () => {
  stopTracking();
});

function stopTracking(){

  trackingActive = false;

  if (trackingTimer) {
    clearTimeout(trackingTimer);
    trackingTimer = null;
  }

}


// ==================================
// 初期化
// ==================================

window.addEventListener('resize', resizeOverlay);

</script>
