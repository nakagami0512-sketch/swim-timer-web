
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071b35">
<title>Swim Timer</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#071b35;
  color:white;
  font-family:Arial,sans-serif;
  padding:18px;
}
h1{text-align:center;color:#55d6ff}
.card{
  background:#122b49;
  padding:16px;
  border-radius:14px;
  margin:14px 0;
}
button{
  background:#168bd0;
  color:white;
  border:0;
  border-radius:9px;
  padding:12px;
  margin:4px;
  font-size:15px;
}
button:disabled{opacity:.5}
video{
  width:100%;
  background:#000;
  border-radius:10px;
}
.time{
  font-size:25px;
  color:#55d6ff;
  font-weight:bold;
}
.small{font-size:13px;color:#b8cce0}
.row{display:flex;flex-wrap:wrap;gap:6px}
#frames{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}
.frame{
  background:#071b35;
  padding:6px;
  border-radius:8px;
}
.frame img{width:100%;border-radius:5px}
</style>
</head>

<body>

<h1>SWIM TIMER</h1>

<div class="card">
<h3>① 動画を選択</h3>
<input id="file" type="file" accept="video/*">
</div>

<div class="card">
<h3>② 動画を確認</h3>
<video id="video" controls playsinline preload="auto"></video>

<div class="card">
<h3>⑤ AI選手検出</h3>

<p id="aiStatus" class="small">
AIモデルの準備ができていません。
</p>

<button id="loadAI">AIモデルを読み込む</button>
<button id="detectPlayers" disabled>選手を検出する</button>

<div id="playerResults"></div>
</div>  

<div class="row">
<button onclick="step(-1)">◀ 1コマ戻る</button>
<button onclick="step(1)">1コマ進む ▶</button>
</div>

<p>現在時刻：
<span id="current" class="time">0.000</span> 秒
</p>
</div>

<div class="card">
<h3>③ スタート・タッチを記録</h3>

<button onclick="mark('start')">スタートを記録</button>
<button onclick="mark('finish')">タッチを記録</button>

<p>スタート：<span id="start">未設定</span></p>
<p>タッチ：<span id="finish">未設定</span></p>

<button onclick="calculate()">タイムを計算</button>
<p class="time" id="result">--.---</p>
</div>

<div class="card">
<h3>④ 動画から画像を取り出す</h3>

<p class="small">
0.5秒ごとの画像をiPhone内で取り出します。
動画は外部に送信しません。
</p>

<button id="extract" onclick="extractFrames()">
画像を取り出す
</button>

<p id="status" class="small">動画を選択してください。</p>
<div id="frames"></div>
</div>
  
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

<script>

const video=document.getElementById('video');

let startTime=null;
let finishTime=null;
let videoUrl=null;
let frameRate=30;

const fileInput=document.getElementById('file');
const frames=document.getElementById('frames');
const status=document.getElementById('status');
const button=document.getElementById('extract');

fileInput.addEventListener('change',e=>{

  const file=e.target.files[0];
  if(!file)return;

  if(videoUrl){
    URL.revokeObjectURL(videoUrl);
  }

  videoUrl=URL.createObjectURL(file);

  video.src=videoUrl;
  video.load();

  startTime=null;
  finishTime=null;

  document.getElementById('start').textContent='未設定';
  document.getElementById('finish').textContent='未設定';
  document.getElementById('result').textContent='--.---';

  frames.innerHTML='';
  status.textContent='動画を読み込んでいます...';

  video.addEventListener('loadedmetadata',()=>{
    status.textContent='動画を読み込みました。';
    update();
  },{once:true});

  video.addEventListener('error',()=>{
    status.textContent='動画の読み込みに失敗しました。';
  },{once:true});

});

function update(){
  document.getElementById('current').textContent=
    video.currentTime.toFixed(3);
}

video.addEventListener('timeupdate',update);
video.addEventListener('seeked',update);

function step(direction){

  if(!video.src)return;

  video.pause();

  video.currentTime=Math.max(
    0,
    Math.min(
      video.duration||0,
      video.currentTime+direction/frameRate
    )
  );
}

function mark(type){

  if(!video.src){
    alert('先に動画を選んでください');
    return;
  }

  if(type==='start'){
    startTime=video.currentTime;
    document.getElementById('start').textContent=
      startTime.toFixed(3)+' 秒';
  }else{
    finishTime=video.currentTime;
    document.getElementById('finish').textContent=
      finishTime.toFixed(3)+' 秒';
  }
}

function calculate(){

  if(startTime===null||finishTime===null){
    alert('スタートとタッチの両方を記録してください');
    return;
  }

  const result=finishTime-startTime;

  if(result<0){
    alert('時刻を確認してください');
    return;
  }

  document.getElementById('result').textContent=
    result.toFixed(3)+' 秒';
}


// 動画の指定時刻への移動を安全に待つ
function seekTo(time){

  return new Promise((resolve,reject)=>{

    const target=Math.max(
      0,
      Math.min(time,Math.max(0,video.duration-0.01))
    );

    // すでに指定位置にいる場合
    if(
      !video.seeking &&
      Math.abs(video.currentTime-target)<0.015
    ){
      setTimeout(resolve,100);
      return;
    }

    let finished=false;

    const cleanup=()=>{
      clearTimeout(timer);
      video.removeEventListener('seeked',onSeeked);
      video.removeEventListener('error',onError);
    };

    const done=()=>{
      if(finished)return;
      finished=true;
      cleanup();
      resolve();
    };

    const fail=()=>{
      if(finished)return;
      finished=true;
      cleanup();
      reject(new Error('動画の移動がタイムアウトしました'));
    };

    const onSeeked=()=>{
      setTimeout(()=>{
        if(video.readyState>=2){
          done();
        }else{
          fail();
        }
      },120);
    };

    const onError=()=>fail();

    const timer=setTimeout(()=>{
      if(
        Math.abs(video.currentTime-target)<0.05 &&
        video.readyState>=2
      ){
        done();
      }else{
        fail();
      }
    },10000);

    video.addEventListener('seeked',onSeeked);
    video.addEventListener('error',onError);

    try{
      video.currentTime=target;
    }catch(e){
      fail();
    }

  });
}


// 動画の画像データが準備されるのを待つ
async function waitForVideoFrame(){

  if(video.readyState<2){

    await new Promise((resolve,reject)=>{

      const timer=setTimeout(()=>{
        cleanup();
        reject(new Error('画像データの読み込み待ちがタイムアウトしました'));
      },5000);

      const onReady=()=>{
        cleanup();
        resolve();
      };

      const onError=()=>{
        cleanup();
        reject(new Error('動画データを読み込めません'));
      };

      const cleanup=()=>{
        clearTimeout(timer);
        video.removeEventListener('loadeddata',onReady);
        video.removeEventListener('error',onError);
      };

      video.addEventListener('loadeddata',onReady,{once:true});
      video.addEventListener('error',onError,{once:true});

    });
  }

  // iPhone Safariの描画準備を待つ
  await new Promise(resolve=>setTimeout(resolve,120));

  if(video.videoWidth===0 || video.videoHeight===0){
    throw new Error('動画の画像サイズを取得できません');
  }
}


// 画像抽出
async function extractFrames(){

  if(
    !video.src ||
    !Number.isFinite(video.duration) ||
    video.duration<=0
  ){
    alert('先に動画を選んでください');
    return;
  }

  if(video.readyState<1){
    alert('動画の読み込みが完了するまで待ってください');
    return;
  }

  button.disabled=true;
  video.pause();
  frames.innerHTML='';

  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d');

  if(!ctx){
    status.textContent='画像処理を開始できません。';
    button.disabled=false;
    return;
  }

  canvas.width=320;

  canvas.height=Math.max(
    1,
    Math.round(
      320*video.videoHeight/video.videoWidth
    )
  );

  const interval=0.5;
  const maxFrames=80;

  const count=Math.min(
    Math.ceil(video.duration/interval),
    maxFrames
  );

  const oldTime=video.currentTime;

  let successCount=0;

  try{

    await waitForVideoFrame();

    for(let i=0;i<count;i++){

      const t=Math.min(
        i*interval,
        Math.max(0,video.duration-0.05)
      );

      status.textContent=
        '画像を取り出しています：'+
        (i+1)+' / '+count;

      await seekTo(t);

      await waitForVideoFrame();

      ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      const img=document.createElement('img');

      img.src=canvas.toDataURL(
        'image/jpeg',
        0.65
      );

      const item=document.createElement('div');
      item.className='frame';

      const label=document.createElement('div');
      label.textContent=t.toFixed(1)+' 秒';
      label.className='small';

      item.appendChild(img);
      item.appendChild(label);

      item.onclick=()=>{
        video.currentTime=t;
        video.pause();
      };

      frames.appendChild(item);

      successCount++;
    }

    status.textContent=
      successCount+'枚の画像を取り出しました。';

  }catch(e){

    status.textContent=
      '画像抽出が停止しました：'+
      e.message+
      '（'+successCount+'枚取得済み）';

  }finally{

    try{
      video.currentTime=oldTime;
    }catch(e){}

    button.disabled=false;

  }

}
// ===== AI選手検出 =====

let aiModel = null;
let selectedPlayer = null;

const aiStatus = document.getElementById('aiStatus');
const loadAIButton = document.getElementById('loadAI');
const detectButton = document.getElementById('detectPlayers');
const playerResults = document.getElementById('playerResults');

// AIモデル読み込み
loadAIButton.addEventListener('click', async () => {

  try {
    aiStatus.textContent = 'AIモデルを読み込んでいます...';

    await tf.ready();

    aiModel = await cocoSsd.load({
      base: 'lite_mobilenet_v2'
    });

    aiStatus.textContent = 'AIモデルの準備ができました！';
    detectButton.disabled = false;

  } catch (error) {
    aiStatus.textContent = '読み込みエラー：' + error.message;
  }

});

// 選手検出
detectButton.addEventListener('click', async () => {

  if (!aiModel || !video.videoWidth) {
    aiStatus.textContent = '先に動画とAIモデルを読み込んでください。';
    return;
  }

  try {

    detectButton.disabled = true;
    aiStatus.textContent = '選手を検出しています...';

    const predictions = await aiModel.detect(video);

    const players = predictions.filter(
      p => p.class === 'person' && p.score >= 0.35
    );

    playerResults.innerHTML = '';

    if (players.length === 0) {
      aiStatus.textContent = '選手を検出できませんでした。';
      return;
    }

    players.forEach((player, index) => {

      const button = document.createElement('button');

      button.textContent =
        '選手 ' + (index + 1) +
        '（検出信頼度 ' +
        Math.round(player.score * 100) + '%）';

      button.style.display = 'block';
      button.style.width = '100%';

      button.onclick = () => {

        selectedPlayer = player;

        aiStatus.textContent =
          '選手 ' + (index + 1) + ' を計測対象に選択しました。';

        document.querySelectorAll('#playerResults button')
          .forEach(b => b.style.background = '#168bd0');

        button.style.background = '#159957';
      };

      playerResults.appendChild(button);

    });

    aiStatus.textContent =
      players.length + '人の選手を検出しました。';

  } catch (error) {

    aiStatus.textContent =
      '検出エラー：' + error.message;

  } finally {

    detectButton.disabled = false;

  }

});
// ===== 選手の簡易追跡 =====

let trackingActive = false;
let trackingTimer = null;
let previousCenter = null;

async function trackSelectedPlayer() {

  if (!trackingActive || !aiModel || video.paused) return;

  try {

    const predictions = await aiModel.detect(video);

    const players = predictions.filter(
      p => p.class === 'person' && p.score >= 0.35
    );

    if (players.length > 0) {

      let target = players[0];

      if (previousCenter) {

        let minDistance = Infinity;

        players.forEach(player => {

          const centerX =
            player.bbox[0] + player.bbox[2] / 2;

          const centerY =
            player.bbox[1] + player.bbox[3] / 2;

          const distance = Math.hypot(
            centerX - previousCenter.x,
            centerY - previousCenter.y
          );

          if (distance < minDistance) {
            minDistance = distance;
            target = player;
          }

        });

      }

      previousCenter = {
        x: target.bbox[0] + target.bbox[2] / 2,
        y: target.bbox[1] + target.bbox[3] / 2
      };

      aiStatus.textContent =
        '追跡中：選手を検出しています';

    } else {

      aiStatus.textContent =
        '選手を見失いました。再検出中...';

    }

  } catch (error) {

    aiStatus.textContent =
      '追跡エラー：' + error.message;

  }

  if (trackingActive) {
    trackingTimer = setTimeout(trackSelectedPlayer, 500);
  }

}

// 動画の再生・停止に連動
video.addEventListener('play', () => {

  aiStatus.textContent = '動画の再生を検知しました。';

  if (selectedPlayer && aiModel) {
    trackingActive = true;
    trackSelectedPlayer();
  } else {
    aiStatus.textContent = '選手またはAIモデルが未選択です。';
  }

});

video.addEventListener('pause', () => {

  trackingActive = false;
  clearTimeout(trackingTimer);

});
</script>

</body>
</html>
